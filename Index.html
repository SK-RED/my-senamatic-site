<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلم البنفسج</title>
    <style>
        :root {
            --lavender-dark: #4a3b5c;
            --lavender-medium: #8a73a6;
            --lavender-light: #eae4f2;
            --bg-gradient: linear-gradient(135deg, #1e1233 0%, #3b2d54 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--lavender-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* تأثير النجوم المتلألئة في الخلفية */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.4;
        }

        .container {
            text-align: center;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            z-index: 1;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            color: #d1bbf2;
            margin-bottom: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(209, 187, 242, 0.5);
        }

        .time {
            font-size: 1.1rem;
            color: var(--lavender-medium);
            margin-bottom: 2rem;
            font-style: italic;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #f0e6ff;
            margin-bottom: 2rem;
        }

        .flower-icon {
            font-size: 2.5rem;
            color: var(--lavender-medium);
            animation: float 3s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <div class="flower-icon">🪻</div>
        <h1>هدوء ليلـي</h1>
        <div class="time">الساعة 2:13 صباحاً</div>
        <p>
            تتسرب تفاصيل الليل بهدوء، كعطر اللافندر حين يمرّ في النسمات الدافئة.. <br>
            لحظات حالمة تُكتب على أطراف السكون.
        </p>
    </div>

</body>
</html>
